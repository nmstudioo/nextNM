<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Structure Lines -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.6">
    <rect x="80" y="120" width="1120" height="400" rx="8"/>
    <line x1="80" y1="200" x2="1200" y2="200" stroke-width="4"/>
    <line x1="320" y1="200" x2="320" y2="520" stroke-width="2"/>
    <line x1="320" y1="360" x2="1200" y2="360" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="360" y="240" width="400" height="80" rx="4" stroke-width="2"/>
    <rect x="360" y="400" width="200" height="80" rx="4" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="600" y="400" width="200" height="80" rx="4" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Code Snippet -->
  <g font-family="monospace" font-size="14" fill="#94a3b8" opacity="0.8">
    <text x="140" y="165">&lt;header class="main-nav"&gt;</text>
    <text x="140" y="185">&lt;nav role="navigation"&gt;...&lt;/nav&gt;</text>
    <text x="350" y="260" fill="#60a5fa">&lt;div class="grid-container"&gt;</text>
    <text x="350" y="280" fill="#60a5fa">&lt;section class="content"&gt;</text>
  </g>

  <!-- Typography -->
  <g transform="translate(80, 60)">
    <text x="0" y="0" font-family="'Inter Tight', -apple-system, sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-1">nextNM</text>
    <text x="0" y="30" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="20" fill="#60a5fa" letter-spacing="2">BLOGGER TEMPLATE · ARCHITECT</text>
  </g>

  <!-- Accent -->
  <rect x="80" y="540" width="120" height="4" fill="#3b82f6"/>
  <text x="220" y="548" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#64748b">REFACTORED XML · MODERN CSS · WCAG 2.1 AA</text>
</svg>
